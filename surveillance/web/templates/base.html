<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Smart Surveillance System{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot" aria-hidden="true"></span>
      Smart Surveillance System
    </div>
    <nav>
      <a href="{{ url_for('dashboard') }}"
         class="{{ 'active' if request.endpoint == 'dashboard' }}">Live</a>
      <a href="{{ url_for('events') }}"
         class="{{ 'active' if request.endpoint == 'events' }}">Event log</a>
      <a href="{{ url_for('settings') }}"
         class="{{ 'active' if request.endpoint == 'settings' }}">Settings</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    Local processing only &middot; snapshots are kept for
    {{ config_retention if config_retention is defined else '30' }} days &middot;
    frames without an alert are never written to disk
  </footer>
</body>
</html>
