# Operator settings. Secrets go in .env, never here.

cameras:
  - id: cam-01
    name: Primary USB camera
    source: 0                # int = USB device index, URL = network stream
    enabled: true
    process_fps: 10

  - id: cam-02
    name: Wi-Fi camera (east corridor)
    source: "rtsp://192.168.1.50:554/stream1"
    enabled: false
    process_fps: 6

detectors:
  - id: person
    weights: weights_people/best.pt
    conf: 0.40
    colour: [0, 225, 0]
    enabled: true

  - id: weapon
    weights: weights_gun/best.pt
    conf: 0.40
    colour: [0, 0, 225]
    enabled: true

  - id: fire
    weights: weights_fire/best.pt
    conf: 0.50
    colour: [225, 0, 0]
    enabled: true
    # Smoke validates at AP@50 0.269 against fire's 0.648, and only finds three
    # of every ten instances, so it earns a much higher bar. See docs/MODEL_CARD.md.
    class_conf:
      fire: 0.50
      smoke: 0.70

analytics:
  loiter_seconds: 20.0
  loiter_radius_px: 80.0
  track_timeout_seconds: 3.0
  weapon_person_overlap: 0.30

# min_consecutive_frames is the false-positive guard; cooldown_seconds then
# suppresses repeats of the same event on the same camera.
rules:
  - event: weapon_detected
    severity: critical
    cooldown_seconds: 30
    min_consecutive_frames: 2
    channels: [desktop, email]

  - event: armed_person
    severity: critical
    cooldown_seconds: 30
    min_consecutive_frames: 2
    channels: [desktop, email]

  - event: fire_detected
    severity: critical
    cooldown_seconds: 60
    # Four frames: a real fire persists, a red object or reflection usually does not.
    min_consecutive_frames: 4
    channels: [desktop, email]

  - event: smoke_detected
    severity: warning
    cooldown_seconds: 60
    min_consecutive_frames: 4
    channels: [desktop]

  - event: loitering
    severity: warning
    cooldown_seconds: 120
    min_consecutive_frames: 1
    channels: [desktop]

storage:
  db_path: data/surveillance.db
  snapshot_dir: data/snapshots
  save_snapshots: true       # only frames that raised an alert are ever written
  retention_days: 30

web:
  host: 127.0.0.1
  port: 8000
  stream_quality: 75
